services:
  foreningsadmin:
    build:
      context: .
      dockerfile: Dockerfile
    image: foreningsadmin:local
    container_name: foreningsadmin
    restart: unless-stopped
    init: true

    ports:
      - "${FORENINGSADMIN_PORT:-8080}:3001"

    env_file:
      - ./runtime/.env

    environment:
      NODE_ENV: production
      PORT: 3001
      FORENINGSADMIN_STATE_DIR: /var/lib/foreningsadmin

    volumes:
      - ./runtime:/var/lib/foreningsadmin
